<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Esirifuah's Palace</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 30%, #feada6 60%, #f6d365 100%);
            overflow: hidden;
            position: relative;
        }

        /* ===== FLOATING SHAPES ===== */
        .shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.3);
            top: 10%; left: 10%;
            animation-delay: 0s;
        }
        .shape:nth-child(2) {
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.2);
            top: 60%; right: 10%;
            animation-delay: 1s;
        }
        .shape:nth-child(3) {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.25);
            bottom: 15%; left: 25%;
            animation-delay: 2s;
        }
        .shape:nth-child(4) {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.15);
            top: 20%; right: 25%;
            animation-delay: 3s;
        }
        .shape:nth-child(5) {
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.3);
            bottom: 30%; right: 30%;
            animation-delay: 4s;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-25px) rotate(10deg); }
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            z-index: 1;
            border: 3px solid rgba(255,255,255,0.5);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(30px); }
            to   { opacity: 1; transform: scale(1)   translateY(0); }
        }

        /* ===== LOGO ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo .icon {
            font-size: 65px;
            margin-bottom: 10px;
            animation: bounce 2s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        .login-logo h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            background: linear-gradient(135deg, #e91e63, #ff6f00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 800;
            color: #555;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 48px;
            border: 3px solid #f0f0f0;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: #e91e63;
            background: white;
            box-shadow: 0 0 0 4px rgba(233,30,99,0.1);
        }

        /* ===== LOGIN BUTTON ===== */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e91e63, #ff6f00);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(233,30,99,0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ===== ERROR ===== */
        .error-msg {
            display: none;
            background: #fff0f3;
            border: 2px solid #ffccdd;
            color: #e91e63;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-8px); }
            75%      { transform: translateX(8px); }
        }

        /* ===== SPINNER ===== */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== BACK LINK ===== */
        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #e91e63;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #ff6f00;
        }
    
        @media(max-width:768px){
            .login-card{padding:35px 25px;margin:15px;border-radius:25px;max-width:none}
            .login-logo .icon{font-size:50px}
            .login-logo h1{font-size:22px}
            .form-group input{padding:13px 15px 13px 42px}
            .login-btn{padding:14px}
        }
        </style>
</head>
<body>

    <!-- Floating shapes -->
    <div class="shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="login-card">

        <div class="login-logo">
            <div class="icon">👑</div>
            <h1>Esirifuah's Palace</h1>
            <p>Admin Panel Login</p>
        </div>

        <div class="error-msg" id="errorMsg">
            ❌ Wrong username or password!
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <span>👤</span>
                    <input type="text" id="username" placeholder="Enter username" required />
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span>🔒</span>
                    <input type="password" id="password" placeholder="Enter password" required />
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">✨ Sign In</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="back-link">
            <a href="/">← Back to Store</a>
        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const spinner  = document.getElementById('spinner');
            const btnText  = document.getElementById('btnText');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.classList.remove('show');

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    errorMsg.classList.add('show');
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                }
            } catch (error) {
                errorMsg.textContent = '❌ Something went wrong!';
                errorMsg.classList.add('show');
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });
    </script>

</body>
</html>
